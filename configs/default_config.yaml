project:
  name: "turkish-word2vec-connotation"
  version: "1.0.0"
  seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  lexicons_dir: "data/lexicons"
  models_dir: "data/models"
  results_dir: "data/results"
  wiki_dump: "data/raw/trwiki-latest-pages-articles.xml.bz2"
  processed_corpus: "data/processed/wiki.tr.txt"
  nrc_vad_path: "data/raw/Turkish-NRC-VAD-Lexicon.csv"
  memolon_path: "data/raw/MTL_grouped/en.tsv"
  merged_lexicon: "data/lexicons/my_Lexicon.csv"

tokenization:
  min_token_len: 2
  max_token_len: 50
  lowercase: true
  filter_non_alpha: false

training:
  vector_size: 300
  window: 5
  min_count: 5
  workers: 4
  epochs: 5
  sg: 1  # 1 for Skip-gram, 0 for CBOW
  binary_format: true
  output_model: "data/models/turkish_word2vec.bin"

evaluation:
  k_values: [1, 3, 10]
  test_words:
    sport:
      tr: "spor"
      en: "sport"
    economy:
      tr: "ekonomi"
      en: "economy"
    magazine:
      tr: "dergi"
      en: "magazine"
    politics:
      tr: "siyaset"
      en: "politics"

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] [%(name)s]: %(message)s"
